<style>
:root{
  --bg:#f2f5f6;
  --surface:#ffffff;
  --surface-2:#e9eef0;
  --fg:#101a1d;
  --muted:#53666c;
  --line:#d8e0e2;
  --accent:#0f7a63;
  --accent-fg:#ffffff;
  --accent2:#6a4fd6;
  --amber:#b4740e;
  --amber-bg:#fdf1dd;
  --amber-fg:#5c3a07;
  --green-bg:#e3f3ec;
  --green-fg:#0f5c47;
  --blue-bg:#e8eef9;
  --blue-fg:#2a4a8f;
  --shadow: 0 1px 2px rgba(16,26,29,.05), 0 6px 20px -8px rgba(16,26,29,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1214;
    --surface:#111d20;
    --surface-2:#172629;
    --fg:#eaf2f1;
    --muted:#92a6a9;
    --line:#223033;
    --accent:#3ddcae;
    --accent-fg:#05201a;
    --accent2:#b1a0ff;
    --amber:#f2b03d;
    --amber-bg:#2e2311;
    --amber-fg:#f6d591;
    --green-bg:#0f2b22;
    --green-fg:#5fe0b6;
    --blue-bg:#15233c;
    --blue-fg:#9db6ea;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -10px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1214;
  --surface:#111d20;
  --surface-2:#172629;
  --fg:#eaf2f1;
  --muted:#92a6a9;
  --line:#223033;
  --accent:#3ddcae;
  --accent-fg:#05201a;
  --accent2:#b1a0ff;
  --amber:#f2b03d;
  --amber-bg:#2e2311;
  --amber-fg:#f6d591;
  --green-bg:#0f2b22;
  --green-fg:#5fe0b6;
  --blue-bg:#15233c;
  --blue-fg:#9db6ea;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -10px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{ margin:0; }
body{
  background:var(--bg);
  color:var(--fg);
  font-family:'Inter',system-ui,sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
body::before{
  content:"";
  position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px);
  z-index:20; background:var(--surface);
}
h1,h2,h3,.display{ font-family:'Fraunces',Georgia,serif; text-wrap:balance; }
.mono{ font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
a{ color:inherit; }
img{ max-width:100%; }
[hidden]{ display:none !important; }

.wrap{ max-width:760px; margin:0 auto; }

header.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:15;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  padding-block:14px 0;
}
.topinner{ max-width:760px; margin:0 auto; }
.brand{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.brand h1{ font-size:1.5rem; font-weight:600; margin:0; letter-spacing:-.01em; }
.brand .dates{ color:var(--muted); font-size:.82rem; font-family:'JetBrains Mono',monospace; white-space:nowrap; }
.stats{ display:flex; gap:8px; margin:10px 0 12px; flex-wrap:wrap; }
.stat{
  display:flex; align-items:baseline; gap:5px;
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:8px; padding:5px 10px; font-size:.78rem; color:var(--muted);
}
.stat b{ font-family:'JetBrains Mono',monospace; color:var(--fg); font-size:.85rem; }
a.stat{
  text-decoration:none; cursor:pointer; -webkit-tap-highlight-color:transparent;
  transition:background .12s ease, border-color .12s ease;
}
a.stat:hover{ border-color:var(--accent); }
a.stat.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
a.stat.active b{ color:var(--accent-fg); }

nav.tabs{
  display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  padding-bottom:12px; scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{ display:none; }
nav.tabs a{
  flex:0 0 auto; text-decoration:none;
  display:flex; flex-direction:column; align-items:center; gap:1px;
  padding:7px 13px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface);
  font-size:.72rem; color:var(--muted); line-height:1.25;
}
nav.tabs a b{ color:var(--fg); font-size:.82rem; font-weight:600; }
nav.tabs a.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
nav.tabs a.active b{ color:var(--accent-fg); }
nav.tabs a.sep{ margin-left:4px; padding-left:13px; border-left:1px solid var(--line); border-radius:10px; }

nav.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  background:var(--surface); border-top:1px solid var(--line);
  box-shadow:0 -4px 16px rgba(0,0,0,.08);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.bottomnav .inner{
  max-width:760px; margin:0 auto; display:flex;
  padding:0 max(4px, env(safe-area-inset-left,0px)) 0 max(4px, env(safe-area-inset-right,0px));
}
nav.bottomnav a{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:9px 2px 8px; text-decoration:none; color:var(--muted);
  font-size:.64rem; font-weight:600; letter-spacing:.01em;
  -webkit-tap-highlight-color:transparent; transition:color .12s ease;
}
nav.bottomnav a svg{ width:21px; height:21px; }
nav.bottomnav a.active{ color:var(--accent); }

main{ padding:18px 0 calc(82px + env(safe-area-inset-bottom,0px)); }
.view{ display:none; }
.view.active{ display:block; }

.daytitle{ margin-bottom:4px; }
.daytitle .eyebrow{ color:var(--accent); font-size:.72rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
.daytitle h2{ font-size:1.35rem; font-weight:500; font-style:italic; margin:2px 0 14px; }

.stop{ border-bottom:1px solid var(--line); }
.stop:last-child{ border-bottom:none; }
.stop > summary{
  display:flex; gap:12px; align-items:flex-start;
  padding:14px 0; cursor:pointer; list-style:none;
  -webkit-tap-highlight-color:transparent;
}
.stop > summary::-webkit-details-marker{ display:none; }
.stop > summary::marker{ content:""; }
.stop > summary:hover .title{ color:var(--accent); }
.stop .time{
  flex:0 0 64px; padding-top:2px;
  font-family:'JetBrains Mono',monospace; font-size:.78rem; color:var(--muted);
  white-space:nowrap;
}
.stop .body{ flex:1; min-width:0; }
.stop .row1{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.stop .title{ font-weight:600; font-size:.97rem; }
.chevron{
  flex:0 0 auto; width:16px; height:16px; margin-top:3px; color:var(--muted);
  transition:transform .18s ease;
}
.stop[open] > summary .chevron{ transform:rotate(180deg); }
.stop .details-content{
  padding:0 0 16px 76px; margin-top:-4px;
}
.stop .details-content .hint{
  font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;
  font-weight:600; margin-bottom:6px;
}
.stop .details-content .empty{ font-size:.82rem; color:var(--muted); font-style:italic; }
.badge{
  display:inline-flex; align-items:center; gap:5px;
  font-size:.68rem; font-weight:600; letter-spacing:.02em;
  padding:2px 8px 2px 6px; border-radius:99px; white-space:nowrap;
}
.badge .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
.badge.status-booked{ background:var(--green-bg); color:var(--green-fg); }
.badge.status-paid{ background:var(--blue-bg); color:var(--blue-fg); }
.badge.status-todo{ background:var(--amber-bg); color:var(--amber-fg); }
.badge.type{ background:var(--surface-2); color:var(--muted); font-weight:500; }

.stop .notes{ color:var(--muted); font-size:.87rem; line-height:1.5; margin-top:4px; }
.stop .conf{ margin-top:6px; font-size:.76rem; color:var(--muted); }
.stop .conf b{ color:var(--fg); font-weight:600; }
.linkrow{ display:flex; gap:14px; margin-top:7px; flex-wrap:wrap; }
.linkrow a{
  font-size:.76rem; font-weight:600; color:var(--accent); text-decoration:none;
  display:inline-flex; align-items:center; gap:4px;
}
.linkrow a:hover{ text-decoration:underline; }
.linkrow svg{ width:12px; height:12px; flex:none; }

.ledger{ display:flex; flex-direction:column; gap:10px; }
.lcard{
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow); overflow:hidden;
}
.lcard > summary{
  display:flex; justify-content:space-between; gap:10px; align-items:flex-start;
  padding:12px 14px; cursor:pointer; list-style:none; -webkit-tap-highlight-color:transparent;
}
.lcard > summary::-webkit-details-marker{ display:none; }
.lcard > summary::marker{ content:""; }
.lcard .chevron{ margin-top:2px; }
.lcard[open] > summary .chevron{ transform:rotate(180deg); }
.lcard .name{ font-weight:600; font-size:.92rem; }
.lcard .cat{ color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; }
.lcard .cost{ font-family:'JetBrains Mono',monospace; font-weight:600; font-size:.92rem; white-space:nowrap; }
.lcard .meta{ color:var(--muted); font-size:.8rem; margin-top:5px; }
.lcard .conf{ margin-top:5px; font-size:.78rem; }
.lcard .conf b{ font-family:'JetBrains Mono',monospace; }
.lcard .details-content{ padding:0 14px 14px; border-top:1px solid var(--line); margin-top:-1px; padding-top:10px; }
.lcard .hint{
  font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;
  font-weight:600; margin-bottom:6px;
}
.qrbox{ margin-top:10px; }
.qrbox img{
  width:128px; height:128px; border-radius:8px; border:1px solid var(--line);
  background:#fff; padding:6px; display:block;
}
.qrhint{ font-size:.72rem; color:var(--muted); margin-top:5px; }
.totals{
  display:flex; justify-content:space-between; align-items:baseline;
  padding:14px 2px 4px; margin-top:4px; border-top:2px solid var(--line);
}
.totals .label{ font-size:.85rem; color:var(--muted); }
.totals .amt{ font-family:'JetBrains Mono',monospace; font-size:1.3rem; font-weight:700; }

.pgroup{ margin-bottom:20px; }
.pgroup h3{ font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--accent2); margin:0 0 8px; font-family:'Inter'; font-weight:700; }
.pitem{ display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); align-items:flex-start; }
.pitem:last-child{ border-bottom:none; }
.pitem input[type=checkbox]{ margin-top:3px; width:16px; height:16px; accent-color:var(--accent); flex:none; }
.pitem label{ font-size:.88rem; font-weight:500; display:block; }
.pitem .sub{ color:var(--muted); font-size:.8rem; margin-top:1px; }
.pitem.checked label, .pitem.checked .sub{ text-decoration:line-through; opacity:.5; }

footer{ text-align:center; color:var(--muted); font-size:.74rem; padding:10px 0 30px; }

@media (max-width:480px){
  .brand h1{ font-size:1.25rem; }
  .stop .time{ flex-basis:54px; font-size:.72rem; }
  .stop .details-content{ padding-left:66px; }
}
</style>
</head>

  </div>
</header>

<main class="wrap">

</main>

<footer>Camille &amp; Tony · 2 travelers · tap a confirmation to copy it</footer>
</div>

function mapUrl(q){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
const pinSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7.1 7-12.5A7 7 0 0 0 5 9.5C5 14.9 12 22 12 22z"/><circle cx="12" cy="9.5" r="2.3"/></svg>';
const linkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M10 14 20 4M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';
const chevronSvg = '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M6 9l6 6 6-6"/></svg>';
const calendarSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
const planeSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M22 2 11 13M22 2 15 22l-4-9-9-4 20-7z"/></svg>';
const bedSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 19v-6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v6M2 19v2M22 19v2M2 15h20"/><rect x="4" y="7" width="6" height="4" rx="1"/></svg>';
const lockSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const suitcaseSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>';

function statusBadge(status){
  if(status==="booked") return '<span class="badge status-booked"><span class="dot"></span>Booked</span>';
  if(status==="paid") return '<span class="badge status-paid"><span class="dot"></span>Paid in full</span>';
  if(status==="todo") return '<span class="badge status-todo"><span class="dot"></span>To book</span>';
  return "";
}

function qrBlock(qr){
  if(!qr) return "";
  return '<div class="qrbox"><a href="'+qr+'" target="_blank" rel="noopener"><img src="'+qr+'" alt="Ticket QR code" width="128" height="128" loading="lazy"></a><div class="qrhint">Tap to enlarge for scanning</div></div>';
}

function renderStop(s){
  const hasDetails = !!(s.conf || s.map || s.site || s.qr);
  let out = '<details class="stop">';
  out += '<summary>';
  out += '<div class="time">'+esc(s.time)+'</div>';
  out += '<div class="body">';
  out += '<div class="row1"><span class="title">'+esc(s.title)+'</span>';
  out += '<span style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">';
  out += '<span class="badge type">'+esc(s.type)+'</span>';
  out += statusBadge(s.status);
  out += '</span></div>';
  if(s.notes) out += '<div class="notes">'+esc(s.notes)+'</div>';
  out += '</div>';
  if(hasDetails) out += chevronSvg;
  out += '</summary>';
  if(hasDetails){
    out += '<div class="details-content">';
    out += '<div class="hint">Confirmation &amp; links</div>';
    if(s.conf) out += '<div class="conf">Confirmation: <b class="mono copyconf" data-conf="'+esc(s.conf)+'" title="Tap to copy" style="cursor:pointer">'+esc(s.conf)+'</b></div>';
    let links = [];
    if(s.map) links.push('<a href="'+mapUrl(s.map)+'" target="_blank" rel="noopener">'+pinSvg+'Map</a>');
    if(s.site) links.push('<a href="'+s.site.url+'" target="_blank" rel="noopener">'+linkSvg+esc(s.site.label)+'</a>');
    if(links.length) out += '<div class="linkrow">'+links.join("")+'</div>';
    out += qrBlock(s.qr);
    out += '</div>';
  }
  out += '</details>';
  return out;
}

function renderDay(d){
  let out = '<div class="view" id="view-'+d.id+'">';
  out += '<div class="daytitle"><span class="eyebrow">Day '+d.num+' · '+esc(d.date)+'</span><h2>'+esc(d.theme)+'</h2></div>';
  d.stops.forEach(s=> out += renderStop(s));
  out += '</div>';
  return out;
}

function renderBookings(){
  let out = '<div class="view" id="view-bookings">';
  out += '<div class="daytitle"><span class="eyebrow">Every reservation</span><h2>Bookings &amp; confirmations</h2></div>';
  out += '<div class="ledger">';
  let total = 0;
  BOOKINGS.forEach(b=>{
    if(typeof b.cost === "number") total += b.cost;
    const hasDetails = !!(b.conf || b.note || b.qr);
    out += '<details class="lcard"><summary>';
    out += '<div><div class="cat">'+esc(b.cat)+'</div><div class="name">'+esc(b.name)+'</div>';
    out += '<div class="meta">'+esc(b.dates)+' &nbsp;·&nbsp; '+statusBadge(b.status)+'</div></div>';
    out += '<span style="display:flex;align-items:flex-start;gap:8px">';
    out += '<div class="cost">'+(b.cost!=null ? "$"+b.cost.toLocaleString() : "—")+'</div>';
    if(hasDetails) out += chevronSvg;
    out += '</span>';
    out += '</summary>';
    if(hasDetails){
      out += '<div class="details-content">';
      out += '<div class="hint">Confirmation &amp; notes</div>';
      if(b.conf) out += '<div class="conf">Confirmation: <b class="mono copyconf" data-conf="'+esc(b.conf)+'" style="cursor:pointer" title="Tap to copy">'+esc(b.conf)+'</b></div>';
      if(b.note) out += '<div class="meta" style="margin-top:4px">'+esc(b.note)+'</div>';
      out += qrBlock(b.qr);
      out += '</div>';
    }
    out += '</details>';
  });
  out += '</div>';
  out += '<div class="totals"><span class="label">Estimated total (USD)</span><span class="amt">$'+total.toLocaleString()+'</span></div>';
  out += '<div class="meta" style="color:var(--muted);font-size:.78rem;margin-top:2px">+ 63,000 AA miles (DFW↔ORD) &middot; + ~$600 dining, gas &amp; incidentals not itemized above</div>';
  out += '</div>';
  return out;
}

function renderFiltered(routeId, eyebrow, title, matchFn, emptyMsg){
  let out = '<div class="view" id="view-'+routeId+'">';
  out += '<div class="daytitle"><span class="eyebrow">'+esc(eyebrow)+'</span><h2>'+esc(title)+'</h2></div>';
  const items = BOOKINGS.filter(matchFn);
  if(!items.length){
    out += '<div class="lcard" style="padding:14px"><div class="meta">'+esc(emptyMsg)+'</div></div>';
    out += '</div>';
    return out;
  }
  out += '<div class="ledger">';
  items.forEach(b=>{
    const hasDetails = !!(b.conf || b.note || b.qr);
    out += '<details class="lcard"><summary>';
    out += '<div><div class="cat">'+esc(b.cat)+'</div><div class="name">'+esc(b.name)+'</div>';
    out += '<div class="meta">'+esc(b.dates)+' &nbsp;·&nbsp; '+statusBadge(b.status)+'</div></div>';
    out += '<span style="display:flex;align-items:flex-start;gap:8px">';
    out += '<div class="cost">'+(b.cost!=null ? "$"+b.cost.toLocaleString() : "—")+'</div>';
    if(hasDetails) out += chevronSvg;
    out += '</span>';
    out += '</summary>';
    if(hasDetails){
      out += '<div class="details-content">';
      out += '<div class="hint">Confirmation &amp; notes</div>';
      if(b.conf) out += '<div class="conf">Confirmation: <b class="mono copyconf" data-conf="'+esc(b.conf)+'" style="cursor:pointer" title="Tap to copy">'+esc(b.conf)+'</b></div>';
      if(b.note) out += '<div class="meta" style="margin-top:4px">'+esc(b.note)+'</div>';
      out += qrBlock(b.qr);
      out += '</div>';
    }
    out += '</details>';
  });
  out += '</div></div>';
  return out;
}

function renderPacking(){
  let out = '<div class="view" id="view-packing">';
  out += '<div class="daytitle"><span class="eyebrow">Before you fly</span><h2>Packing &amp; reminders</h2></div>';
  PACKING.forEach((g,gi)=>{
    out += '<div class="pgroup"><h3>'+esc(g.group)+'</h3>';
    g.items.forEach((it,ii)=>{
      const id = "pk-"+gi+"-"+ii;
      out += '<div class="pitem" data-id="'+id+'">';
      out += '<input type="checkbox" id="'+id+'">';
      out += '<div><label for="'+id+'">'+esc(it[0])+'</label><div class="sub">'+esc(it[1])+'</div></div>';
      out += '</div>';
    });
    out += '</div>';
  });
  out += '</div>';
  return out;
}

/* ---------------- build ---------------- */
let viewsHtml = "";
DAYS.forEach(d=> viewsHtml += renderDay(d));
viewsHtml += renderBookings();
viewsHtml += renderFiltered("todo", "Still open", "Things to book",
  b=>b.status==="todo", "Everything's booked — nothing left to do.");
viewsHtml += renderFiltered("confirmed", "Locked in", "Confirmed bookings",
  b=>b.status==="booked"||b.status==="paid", "Nothing confirmed yet.");
viewsHtml += renderFiltered("flights", "In the air", "Flights",
  b=>b.cat==="Flights", "No flights logged yet.");
viewsHtml += renderFiltered("lodgings", "Where you're staying", "Lodgings",
  b=>b.cat==="Lodging", "No lodging logged yet.");
viewsHtml += renderPacking();
document.getElementById("views").innerHTML = viewsHtml;

let tabsHtml = "";
DAYS.forEach(d=>{
  tabsHtml += '<a href="#'+d.id+'" data-route="'+d.id+'"><b>'+esc(d.date.split("· ")[1]||d.date)+'</b></a>';
});
document.getElementById("tabRail").innerHTML = tabsHtml;

const BOTTOM_NAV = [
  { group:"agenda",   route: DAYS[0].id, label:"Agenda",   icon: calendarSvg },
  { group:"flights",  route:"flights",   label:"Flights",  icon: planeSvg },
  { group:"lodgings", route:"lodgings",  label:"Lodgings", icon: bedSvg },
  { group:"bookings", route:"bookings",  label:"Bookings", icon: lockSvg },
  { group:"packing",  route:"packing",   label:"Packing",  icon: suitcaseSvg }
];
document.getElementById("bottomNav").innerHTML =
  '<div class="inner">' +
  BOTTOM_NAV.map(n=>
    '<a href="#'+n.route+'" data-group="'+n.group+'">'+n.icon+'<span>'+esc(n.label)+'</span></a>'
  ).join("") +
  '</div>';

const bookedCount = BOOKINGS.filter(b=>b.status==="booked"||b.status==="paid").length;
const todoCount = BOOKINGS.filter(b=>b.status==="todo").length;
const total = BOOKINGS.reduce((a,b)=> a + (b.cost||0), 0);
document.getElementById("statRow").innerHTML =
  '<a class="stat" href="#confirmed" data-route="confirmed">Confirmed <b>'+bookedCount+'</b></a>'+
  '<a class="stat" href="#todo" data-route="todo">To book <b>'+todoCount+'</b></a>'+
  '<span class="stat">Est. total <b>$'+total.toLocaleString()+'</b></span>';

/* ---------------- routing ---------------- */
const validRoutes = DAYS.map(d=>d.id).concat(["bookings","packing","todo","confirmed","flights","lodgings"]);
function routeGroup(route){
  if(DAYS.some(d=>d.id===route)) return "agenda";
  if(route==="bookings"||route==="todo"||route==="confirmed") return "bookings";
  if(route==="flights") return "flights";
  if(route==="lodgings") return "lodgings";
  if(route==="packing") return "packing";
  return "agenda";
}
function go(route){
  if(!validRoutes.includes(route)) route = DAYS[0].id;
  document.querySelectorAll(".view").forEach(v=> v.classList.remove("active"));
  const el = document.getElementById("view-"+route);
  if(el) el.classList.add("active");
  document.querySelectorAll("nav.tabs a").forEach(a=>{
    a.classList.toggle("active", a.getAttribute("data-route")===route);
  });
  document.querySelectorAll("a.stat").forEach(a=>{
    a.classList.toggle("active", a.getAttribute("data-route")===route);
  });
  const group = routeGroup(route);
  document.querySelectorAll("nav.bottomnav a").forEach(a=>{
    a.classList.toggle("active", a.getAttribute("data-group")===group);
  });
  const activeTab = document.querySelector('nav.tabs a[data-route="'+route+'"]');
  if(activeTab) activeTab.scrollIntoView({inline:"center", block:"nearest"});
  window.scrollTo({top:0});
}
window.addEventListener("hashchange", ()=> go(location.hash.slice(1)));
go(location.hash ? location.hash.slice(1) : DAYS[0].id);

/* ---------------- copy confirmations ---------------- */
document.addEventListener("click", function(e){
  const t = e.target.closest(".copyconf");
  if(!t) return;
  const val = t.getAttribute("data-conf");
  const prev = t.textContent;
  function flash(){ t.textContent = "Copied"; setTimeout(()=> t.textContent = prev, 1100); }
  try{
    navigator.clipboard.writeText(val).then(flash).catch(()=>{
      const r = document.createRange(); r.selectNodeContents(t);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    });
  }catch(err){
    const r = document.createRange(); r.selectNodeContents(t);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }
});

/* ---------------- packing persistence (per-viewer only) ---------------- */
try{
  const saved = JSON.parse(localStorage.getItem("iceland-packing")||"{}");
  document.querySelectorAll('.pitem input[type=checkbox]').forEach(cb=>{
    const id = cb.closest(".pitem").getAttribute("data-id");
    if(saved[id]){ cb.checked = true; cb.closest(".pitem").classList.add("checked"); }
  });
}catch(e){}
document.addEventListener("change", function(e){
  if(e.target.matches('.pitem input[type=checkbox]')){
    const item = e.target.closest(".pitem");
    item.classList.toggle("checked", e.target.checked);
    try{
      const saved = JSON.parse(localStorage.getItem("iceland-packing")||"{}");
      saved[item.getAttribute("data-id")] = e.target.checked;
      localStorage.setItem("iceland-packing", JSON.stringify(saved));
    }catch(err){}
  }
});

})();
</script>
